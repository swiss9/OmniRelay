<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OmniRelay Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      max-width: 500px;
      margin: 2rem auto;
      padding: 1.5rem;
    }
    .logo {
      display: block;
      width: 60px;
      height: auto;
      margin: 0 auto 1rem;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin: 1rem 0 0.25rem;
      font-weight: 600;
      color: #ccc;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #333;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: #fff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    #saveStatus, #licenseStatus {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #4ade80;
    }
    .advanced-toggle {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #888;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }
    .advanced-toggle:hover {
      color: #fff;
    }
    #advancedSection {
      display: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <img src="https://i.ibb.co/QjtH2qtx/1000176798.png" alt="OmniRelay logo" class="logo">
  <h1>Settings</h1>

  <label>Telegram Chat ID</label>
  <input type="text" id="telegramChatId" placeholder="-1001234567890">

  <label>Discord Webhook URL</label>
  <input type="text" id="discordWebhook" placeholder="https://discord.com/api/webhooks/...">

  <label>License Key (leave empty for free tier)</label>
  <input type="text" id="license" placeholder="OMNI-XXXXXXXX">

  <button id="saveBtn">Save</button>
  <div id="saveStatus"></div>

  <button id="checkLicenseBtn" style="background:#333; color:#fff;">Validate License</button>
  <div id="licenseStatus"></div>

  <div class="advanced-toggle" id="advancedToggle">▼ Advanced (self‑hosted only)</div>
  <div id="advancedSection">
    <label>Custom Backend URL</label>
    <input type="text" id="backendUrl" placeholder="https://your-backend.vercel.app">
  </div>

  <script src="options.js"></script>
</body>
</html>
